[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "shopping-bot"
version = "0.1.0"
description = "Telegram shopping list bot for couples"
requires-python = ">=3.9"
dependencies = [
    "pyTelegramBotAPI>=4.14.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
shopping-bot = "bot:main"
